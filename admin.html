<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Record Society Expense</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem 1rem; }
    .container { max-width: 480px; margin: 0 auto; }
    .card {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }
    h2 { font-size: 1.3rem; margin-bottom: 1rem; color: var(--primary); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .status-msg { margin-top: 1rem; font-size: 0.9rem; text-align: center; }
    .back-link { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .hidden { display: none; }
    .user-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }
    .logout-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.8rem; font-weight: 600; width: auto; padding: 0; }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Back to Public Ledger</a>

    <!-- AUTHENTICATION SCREEN -->
    <div id="authSection" class="card" style="text-align: center; padding: 2.5rem 1.5rem;">
      <h2 style="margin-bottom: 0.5rem;">Committee Access Only</h2>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Sign in with your authorized Gmail account to record expenses.</p>
      
      <div id="googleSignInBtn" style="display: flex; justify-content: center;"></div>
      <div id="authError" class="status-msg" style="color: var(--danger);"></div>
    </div>

    <!-- ADMIN FORM (HIDDEN UNTIL AUTHENTICATED) -->
    <div id="formSection" class="card hidden">
      <div class="user-badge">
        <span id="signedInUser"></span>
        <button class="logout-btn" onclick="logout()">Sign Out</button>
      </div>

      <h2>Record Society Expense</h2>
      <form id="txForm">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="type">Expense Category</label>
          <select id="type" required>
            <option value="Water Bill">Water Bill</option>
            <option value="Electricity Bill">Electricity Bill</option>
            <option value="Sweeper Salary">Sweeper Salary</option>
            <option value="Drainage Cleaning">Drainage Cleaning</option>
            <option value="Security Guard Salary">Security Guard Salary</option>
            <option value="Lift Maintenance">Lift Maintenance</option>
            <option value="Gardening & Pest Control">Gardening & Pest Control</option>
            <option value="General Repair / Other">General Repair / Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" step="0.01" placeholder="e.g. 3500" required />
        </div>
        <div class="form-group">
          <label for="paymentMode">Payment Mode</label>
          <select id="paymentMode">
            <option value="UPI / Online">UPI / Online</option>
            <option value="Net Banking / NEFT">Net Banking / NEFT</option>
            <option value="Cheque">Cheque</option>
            <option value="Cash">Cash</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Description / Notes</label>
          <textarea id="description" rows="2" placeholder="e.g., Tanker vendor invoice #402"></textarea>
        </div>
        <button type="submit" id="submitBtn">Save to Google Sheet</button>
      </form>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <script>
    // ----------------- CONFIGURATION -----------------
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzqUDJHnAFvX1fcVcx6pwhxwFAFPnIScriuixv9KHhSkeEe_3ufM-TIvYK459uZ3WbE/exec";
    const GOOGLE_CLIENT_ID = "51409712544-u0r0v16npumk433sll7kr7ugubvr8528.apps.googleusercontent.com";
    
    // Add all authorized committee emails here (lowercase)
    const AUTHORIZED_EMAILS = [
		"joshipavanr@gmail.com",
		"pavanjoshi.mca@gmail.com",
		"secretary.society@gmail.com"
    ];
    // -------------------------------------------------

    let currentUserEmail = "";

    // Parse Google JWT Token without external libraries
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const payload = parseJwt(response.credential);
      const email = payload.email.toLowerCase();

      if (AUTHORIZED_EMAILS.includes(email)) {
        currentUserEmail = email;
        sessionStorage.setItem("admin_email", email);
        showAdminPanel(email);
      } else {
        document.getElementById("authError").textContent = 
          `Access Denied: ${email} is not listed in the authorized committee list.`;
      }
    }

    function showAdminPanel(email) {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("formSection").classList.remove("hidden");
      document.getElementById("signedInUser").textContent = `Logged in: ${email}`;
      document.getElementById("date").value = new Date().toISOString().split("T")[0];
    }

    function logout() {
      sessionStorage.removeItem("admin_email");
      currentUserEmail = "";
      location.reload();
    }

    window.onload = function () {
      const savedEmail = sessionStorage.getItem("admin_email");
      if (savedEmail && AUTHORIZED_EMAILS.includes(savedEmail)) {
        currentUserEmail = savedEmail;
        showAdminPanel(savedEmail);
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleSignInBtn"),
        { theme: "outline", size: "large", text: "signin_with", shape: "rectangular" }
      );
    };

    // Handle Form Submit
    document.getElementById("txForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const statusMsg = document.getElementById("statusMsg");

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";
      statusMsg.textContent = "";

      const payload = {
        date: document.getElementById("date").value,
        type: document.getElementById("type").value,
        amount: document.getElementById("amount").value,
        paymentMode: document.getElementById("paymentMode").value,
        description: document.getElementById("description").value,
        addedBy: currentUserEmail // Records who added it
      };

      try {
        await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        statusMsg.style.color = "var(--success)";
        statusMsg.textContent = "✓ Expense successfully saved to Google Sheet!";
        document.getElementById("amount").value = "";
        document.getElementById("description").value = "";
      } catch (err) {
        console.error(err);
        statusMsg.style.color = "var(--danger)";
        statusMsg.textContent = "Failed to save transaction.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Save to Google Sheet";
      }
    });
  </script>
</body>
</html>
