<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Society Ledger & Maintenance</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      background: var(--bg);
      color: var(--text);
      padding: clamp(0.75rem, 2.5vw, 1.5rem);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1040px; margin: 0 auto; width: 100%; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    h1 {
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      font-weight: 700;
      color: var(--primary);
    }

    .header-actions { display: flex; gap: 0.5rem; }

    .btn {
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      border: 1px solid transparent;
    }

    .btn-outline { background: var(--surface); border-color: var(--border); color: var(--accent); }
    .btn-primary { background: var(--accent); color: #fff; }

    /* Filters */
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.6rem;
      background: var(--surface);
      padding: 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .filter-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .filter-group label { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; }

    select {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 0.88rem;
      min-height: 38px;
    }

    .sync-notice {
      grid-column: 1 / -1;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }

    /* Stats Grid */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: var(--surface);
      padding: 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .stat-title { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.15rem; }
    .stat-val { font-size: 1.25rem; font-weight: 700; color: var(--text); }

    /* Analytics Chart */
    .section-card {
      background: var(--surface);
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .section-title { font-size: 0.95rem; font-weight: 700; color: var(--primary); margin-bottom: 0.75rem; }
    .chart-container { position: relative; width: 100%; height: 220px; margin-bottom: 1rem; }
    
    .category-bars { display: flex; flex-direction: column; gap: 0.6rem; }
    .bar-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 500; }
    .bar-track { width: 100%; height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }

    /* Compact Table Styling */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th, td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th { background: #f8fafc; color: var(--muted); font-weight: 600; font-size: 0.8rem; }
    tr:hover { background: #fdfdfd; }

    .desc-col {
      white-space: normal;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0369a1;
    }

    .amount { font-weight: 700; color: var(--danger); text-align: right; }
    .empty-state { text-align: center; padding: 2rem 1rem; color: var(--muted); }

    /* Modal (Popup) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }
    .modal-backdrop.active { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 12px;
      width: 100%;
      max-width: 760px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.15);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
      padding: 0 0.25rem;
    }

    .modal-body { padding: 1rem; overflow-y: auto; }

    .tab-bar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
    .tab-btn {
      padding: 0.45rem 0.75rem;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active { color: var(--accent); border-color: var(--accent); }

    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 9999px;
    }
    .status-paid { background: #dcfce7; color: var(--success); }
    .status-pending { background: #fee2e2; color: var(--danger); }
    .status-partial { background: #fef3c7; color: var(--warning); }

    /* ========================================================= */
    /* MOBILE-SPECIFIC COLUMN HIDING (< 640px)                  */
    /* ========================================================= */
    @media (max-width: 640px) {
      .header-actions { width: 100%; }
      .header-actions .btn { flex: 1; justify-content: center; }

      /* Table column visibility controls */
      .hide-mobile {
        display: none !important;
      }

      /* Compact cell padding on smaller screens */
      th, td {
        padding: 0.5rem 0.55rem;
        font-size: 0.82rem;
      }

      .desc-col {
        max-width: 140px; /* Limits description width to prevent horizontal stretching */
      }

      .amount {
        font-size: 0.9rem;
      }

      .date-col {
        font-size: 0.75rem;
        color: var(--muted);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🏢 G5 - Society Transactions</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openMaintenanceModal()">📋 Maintenance</button>
        <a href="admin.html" class="btn btn-outline">+ Add Expense</a>
      </div>
    </header>

    <!-- Filter Bar -->
    <div class="filters">
      <div class="filter-group">
        <label for="fyFilter">Financial Year</label>
        <select id="fyFilter"></select>
      </div>
      <div class="filter-group">
        <label for="monthFilter">Month View</label>
        <select id="monthFilter"></select>
      </div>
      <div class="sync-notice" id="loadingNotice">Loading data...</div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-title">Period Expenses</div>
        <div class="stat-val" id="totalExpense">₹0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Count</div>
        <div class="stat-val" id="totalCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Top Expense</div>
        <div class="stat-val" id="topCategory">-</div>
      </div>
    </div>

    <!-- Breakdown Chart -->
    <div class="section-card">
      <div class="section-title">📊 Expense Distribution</div>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
      <div class="category-bars" id="categoryBars"></div>
    </div>

    <!-- Transactions Table -->
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th class="hide-mobile">Mode</th>
            <th style="text-align: right;">Amount</th>
          </tr>
        </thead>
        <tbody id="txBody">
          <tr><td colspan="5" class="empty-state">Loading transactions...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- POPUP: Maintenance Collections & Defaulters -->
  <div class="modal-backdrop" id="maintModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 style="font-size: 1.1rem; color: var(--primary);">Flat Maintenance Status</h2>
          <span style="font-size: 0.75rem; color: var(--muted);" id="modalFyLabel"></span>
        </div>
        <button class="modal-close" onclick="closeMaintenanceModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="stats" style="margin-bottom: 0.75rem;">
          <div class="stat-card" style="border-left: 3px solid var(--success);">
            <div class="stat-title">Collected</div>
            <div class="stat-val" id="maintTotalCollected" style="color: var(--success); font-size: 1.1rem;">₹0</div>
          </div>
          <div class="stat-card" style="border-left: 3px solid var(--danger);">
            <div class="stat-title">Pending</div>
            <div class="stat-val" id="maintTotalPending" style="color: var(--danger); font-size: 1.1rem;">₹0</div>
          </div>
          <div class="stat-card" style="border-left: 3px solid var(--warning);">
            <div class="stat-title">Defaulters</div>
            <div class="stat-val" id="maintPendingCount" style="font-size: 1.1rem;">0</div>
          </div>
        </div>

        <div class="tab-bar">
          <button class="tab-btn active" id="tabDefaulters" onclick="switchTab('defaulters')">⚠️ Pending Flats</button>
          <button class="tab-btn" id="tabAll" onclick="switchTab('all')">🏢 All Flats</button>
        </div>

        <div class="card" style="max-height: 380px; overflow-y: auto;">
          <table>
            <thead>
              <tr>
                <th>Flat</th>
                <th class="hide-mobile">Wing</th>
                <th class="hide-mobile">Resident</th>
                <th>Due</th>
                <th>Paid</th>
                <th class="hide-mobile">Status</th>
              </tr>
            </thead>
            <tbody id="maintTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzqUDJHnAFvX1fcVcx6pwhxwFAFPnIScriuixv9KHhSkeEe_3ufM-TIvYK459uZ3WbE/exec";
    let allTransactions = [];
    let allMaintenance = [];
    let chartInstance = null;
    let activeModalTab = "defaulters";

    const barColors = ['#2563eb', '#0891b2', '#059669', '#d97706', '#dc2626', '#7c3aed', '#db2777', '#4b5563'];

    const fyMonths = [
      { name: "Full FY (All Months)", value: "ALL" },
      { name: "April", value: 3 },
      { name: "May", value: 4 },
      { name: "June", value: 5 },
      { name: "July", value: 6 },
      { name: "August", value: 7 },
      { name: "September", value: 8 },
      { name: "October", value: 9 },
      { name: "November", value: 10 },
      { name: "December", value: 11 },
      { name: "January", value: 0 },
      { name: "February", value: 1 },
      { name: "March", value: 2 }
    ];

    function getIndianFY(d) {
      const year = d.getFullYear();
      const month = d.getMonth();
      return month >= 3 ? `${year}-${year + 1}` : `${year - 1}-${year}`;
    }

    function initFilters() {
      const now = new Date();
      const currentFY = getIndianFY(now);
      const currentMonth = now.getMonth();

      const baseYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1;
      const fySelect = document.getElementById("fyFilter");

      for (let y = baseYear - 2; y <= baseYear + 1; y++) {
        const fyString = `${y}-${y + 1}`;
        const opt = document.createElement("option");
        opt.value = fyString;
        opt.textContent = `FY ${fyString}`;
        if (fyString === currentFY) opt.selected = true;
        fySelect.appendChild(opt);
      }

      const monthSelect = document.getElementById("monthFilter");
      fyMonths.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.value;
        opt.textContent = m.name;
        if (m.value === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      });

      fySelect.addEventListener("change", render);
      monthSelect.addEventListener("change", render);
    }

    async function loadData() {
      try {
        const res = await fetch(API_ENDPOINT);
        const json = await res.json();
        allTransactions = json.expenses || json.data || [];
        allMaintenance = json.maintenance || [];
        document.getElementById("loadingNotice").textContent = `Refreshed: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        render();
      } catch (err) {
        console.error(err);
        document.getElementById("loadingNotice").textContent = "Sync failed.";
      }
    }

    function render() {
      const selectedFY = document.getElementById("fyFilter").value;
      const selectedMonth = document.getElementById("monthFilter").value;

      const filtered = allTransactions.filter(item => {
        const d = new Date(item.date);
        const itemFY = getIndianFY(d);
        if (itemFY !== selectedFY) return false;
        if (selectedMonth !== "ALL" && d.getMonth() !== parseInt(selectedMonth)) return false;
        return true;
      });

      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

      let total = 0;
      const categoryMap = {};

      filtered.forEach(tx => {
        const amt = Number(tx.amount);
        total += amt;
        categoryMap[tx.type] = (categoryMap[tx.type] || 0) + amt;
      });

      // Populate Transactions
      const tbody = document.getElementById("txBody");
      tbody.innerHTML = "";

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No transactions recorded for this period.</td></tr>`;
      } else {
        filtered.forEach(tx => {
          const tr = document.createElement("tr");
          // Shorten date format for cleaner mobile view (e.g. 14 Sep)
          const d = new Date(tx.date);
          const shortDate = d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

          tr.innerHTML = `
            <td class="date-col" title="${tx.date}">${shortDate}</td>
            <td><span class="badge">${tx.type}</span></td>
            <td class="desc-col">${tx.description || '-'}</td>
            <td class="hide-mobile"><small style="color: var(--muted)">${tx.paymentMode || 'Online'}</small></td>
            <td class="amount">₹${Number(tx.amount).toLocaleString('en-IN')}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("totalExpense").textContent = `₹${total.toLocaleString('en-IN')}`;
      document.getElementById("totalCount").textContent = filtered.length;

      renderAnalytics(categoryMap, total);
    }

    function renderAnalytics(categoryMap, total) {
      const barsContainer = document.getElementById("categoryBars");
      barsContainer.innerHTML = "";

      const sortedCategories = Object.entries(categoryMap).sort((a, b) => b[1] - a[1]);

      if (sortedCategories.length === 0 || total === 0) {
        document.getElementById("topCategory").textContent = "-";
        barsContainer.innerHTML = `<p style="color: var(--muted); font-size: 0.8rem;">No data to analyze.</p>`;
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }

      document.getElementById("topCategory").textContent = sortedCategories[0][0];

      const labels = [];
      const dataPercentages = [];
      const dataAmounts = [];

      sortedCategories.forEach(([cat, amount], index) => {
        const percentage = ((amount / total) * 100).toFixed(1);
        const color = barColors[index % barColors.length];

        labels.push(cat);
        dataPercentages.push(percentage);
        dataAmounts.push(amount);

        const barItem = document.createElement("div");
        barItem.className = "bar-row";
        barItem.innerHTML = `
          <div class="bar-meta">
            <span><strong>${cat}</strong> (${percentage}%)</span>
            <span>₹${amount.toLocaleString('en-IN')}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width: ${percentage}%; background-color: ${color};"></div>
          </div>
        `;
        barsContainer.appendChild(barItem);
      });

      const ctx = document.getElementById("expenseChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            data: dataPercentages,
            backgroundColor: barColors.slice(0, labels.length),
            borderRadius: 4
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: context => ` ${context.raw}% (₹${dataAmounts[context.dataIndex].toLocaleString('en-IN')})`
              }
            }
          },
          scales: {
            x: { beginAtZero: true, max: 100, ticks: { callback: val => val + '%' }, grid: { color: '#f1f5f9' } },
            y: { grid: { display: false } }
          }
        }
      });
    }

    // Modal Operations
    function openMaintenanceModal() {
      const selectedFY = document.getElementById("fyFilter").value;
      document.getElementById("modalFyLabel").textContent = `FY ${selectedFY}`;
      renderMaintenance();
      document.getElementById("maintModal").classList.add("active");
    }

    function closeMaintenanceModal() {
      document.getElementById("maintModal").classList.remove("active");
    }

    function switchTab(tab) {
      activeModalTab = tab;
      document.getElementById("tabDefaulters").classList.toggle("active", tab === "defaulters");
      document.getElementById("tabAll").classList.toggle("active", tab === "all");
      renderMaintenance();
    }

    function renderMaintenance() {
      const selectedFY = document.getElementById("fyFilter").value;
      const maintList = allMaintenance.filter(m => !m.fy || m.fy === selectedFY);

      let totalCollected = 0;
      let totalPending = 0;
      let pendingCount = 0;

      maintList.forEach(m => {
        totalCollected += m.paidAmount;
        const balance = m.dueAmount - m.paidAmount;
        if (balance > 0) {
          totalPending += balance;
          pendingCount++;
        }
      });

      document.getElementById("maintTotalCollected").textContent = `₹${totalCollected.toLocaleString('en-IN')}`;
      document.getElementById("maintTotalPending").textContent = `₹${totalPending.toLocaleString('en-IN')}`;
      document.getElementById("maintPendingCount").textContent = pendingCount;

      const tbody = document.getElementById("maintTableBody");
      tbody.innerHTML = "";

      const displayedList = activeModalTab === "defaulters" 
        ? maintList.filter(m => (m.dueAmount - m.paidAmount) > 0 || m.status.toLowerCase() !== "paid")
        : maintList;

      if (displayedList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">
          ${activeModalTab === "defaulters" ? "🎉 No dues pending for this FY!" : "No records found."}
        </td></tr>`;
        return;
      }

      displayedList.forEach(m => {
        const balance = m.dueAmount - m.paidAmount;
        let badgeClass = "status-pending";
        if (m.paidAmount >= m.dueAmount && m.dueAmount == 0) badgeClass = "status-paid";
        else if (m.paidAmount > 0) badgeClass = "status-partial";

        // Display wing prefix with Flat No. on mobile so context isn't lost
        const flatLabel = m.wing ? `${m.wing}-${m.flatNo}` : m.flatNo;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${flatLabel}</strong></td>
          <td class="hide-mobile">${m.wing || '-'}</td>
          <td class="hide-mobile">${m.ownerName || '-'}</td>
          <td>₹${m.dueAmount.toLocaleString('en-IN')}</td>
          <td style="color: var(--success); font-weight: 600;">₹${m.paidAmount.toLocaleString('en-IN')}</td>
          <td class="hide-mobile"><span class="status-badge ${badgeClass}">${m.status || (balance <= 0 ? 'PAID' : 'PENDING')}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById("maintModal").addEventListener("click", (e) => {
      if (e.target.id === "maintModal") closeMaintenanceModal();
    });

    window.addEventListener("DOMContentLoaded", () => {
      initFilters();
      loadData();
    });
  </script>
</body>
</html>
